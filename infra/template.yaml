AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Small public web server for Seoul (ap-northeast-2): one VPC, one public
  subnet, an nginx EC2 instance, and the minimum supporting network resources.

Parameters:
  SSHIngressCidr:
    Type: String
    Default: 203.0.113.0/32
    Description: Narrow IPv4 CIDR that may connect to SSH (port 22).
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/(1[6-9]|2[0-9]|3[0-2])$'
    ConstraintDescription: Must be an IPv4 CIDR with a /16 through /32 prefix.

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the web server.
    AllowedValues:
      - t3.micro
      - t3.small
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for SSH. Store the private key securely.

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-routes'

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP and narrowly scoped administrative SSH.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: Public HTTP endpoint.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: SSH from the explicitly supplied trusted CIDR.
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHIngressCidr
      SecurityGroupEgress:
        - Description: Permit outbound package installation and normal responses.
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web-sg'

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          GroupSet:
            - !GetAtt WebSecurityGroup.GroupId
          SubnetId: !Ref PublicSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y nginx
          printf 'OK\n' > /usr/share/nginx/html/health
          systemctl enable --now nginx
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web'

Outputs:
  VpcId:
    Description: VPC identifier.
    Value: !Ref VPC

  PublicSubnetId:
    Description: Public subnet identifier.
    Value: !Ref PublicSubnet

  WebInstanceId:
    Description: EC2 web server identifier.
    Value: !Ref WebServer

  WebPublicIp:
    Description: Public IPv4 address used by the integration test.
    Value: !GetAtt WebServer.PublicIp

  HealthUrl:
    Description: HTTP health endpoint; it should return exactly OK.
    Value: !Sub 'http://${WebServer.PublicIp}/health'
