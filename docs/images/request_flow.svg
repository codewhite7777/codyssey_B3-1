<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>요청 흐름과 단계별 실패 증상</title><rect width="680" height="300" fill="#FFFFFF" rx="12"/><rect x="40" y="12" width="600" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="29.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">사용자: curl -i http://&lt;퍼블릭IP&gt;/health</text><line x1="94" y1="46" x2="94" y2="54" stroke="#5F5E5A" stroke-width="1.3"/><path d="M89 52 L94 60 L99 52" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="60" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="94.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">① Public IP</text><text x="94.0" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">가게 주소</text><line x1="150" y1="88" x2="160" y2="88" stroke="#185FA5" stroke-width="1.3"/><path d="M158 83 L166 88 L158 93" fill="none" stroke="#185FA5" stroke-width="1.3"/><line x1="94.0" y1="116" x2="94.0" y2="144" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="168" y="60" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="222.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">② IGW</text><text x="222.0" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">건물 정문</text><line x1="278" y1="88" x2="288" y2="88" stroke="#185FA5" stroke-width="1.3"/><path d="M286 83 L294 88 L286 93" fill="none" stroke="#185FA5" stroke-width="1.3"/><line x1="222.0" y1="116" x2="222.0" y2="144" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="296" y="60" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="350.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">③ Route Table</text><text x="350.0" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">안내판</text><line x1="406" y1="88" x2="416" y2="88" stroke="#185FA5" stroke-width="1.3"/><path d="M414 83 L422 88 L414 93" fill="none" stroke="#185FA5" stroke-width="1.3"/><line x1="350.0" y1="116" x2="350.0" y2="144" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="424" y="60" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="478.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">④ SG (80)</text><text x="478.0" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">경비원</text><line x1="534" y1="88" x2="544" y2="88" stroke="#185FA5" stroke-width="1.3"/><path d="M542 83 L550 88 L542 93" fill="none" stroke="#185FA5" stroke-width="1.3"/><line x1="478.0" y1="116" x2="478.0" y2="144" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="552" y="60" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="606.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">⑤ Nginx</text><text x="606.0" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">카운터 직원</text><line x1="606.0" y1="116" x2="606.0" y2="144" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="40" y="144" width="492" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="286.0" y="162.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">빠지면 timeout (응답 없음)</text><text x="286.0" y="183.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">요청이 서버까지 도착하지 못함 → 라우팅 · SG · 퍼블릭 IP 확인</text><rect x="552" y="144" width="108" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="606.0" y="162.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">refused</text><text x="606.0" y="183.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">받을 직원 없음</text><rect x="40" y="224" width="600" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="242.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">⑥ 응답이 돌아가는 길</text><text x="340.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">SG가 기억한 연결이라 자동 허용(stateful) → 0.0.0.0/0 → IGW → 사용자에게 200 OK</text></svg>
