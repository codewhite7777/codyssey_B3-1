<text x="604.0" y="158" font-size="13" fill="#5F5E5A" font-weight="bold" text-anchor="middle">자유 16비트</text>
<text x="740" y="102" font-size="14" fill="#2C2C2A" font-weight="normal" text-anchor="start">10.0.0.0 ~ 10.0.255.255</text>
<text x="740" y="124" font-size="14" fill="#185FA5" font-weight="bold" text-anchor="start">256 × 256 = 65,536개</text>
<text x="30" y="204" font-size="15" fill="#0F6E56" font-weight="bold" text-anchor="start">Subnet</text>
