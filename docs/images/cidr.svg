<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<rect width="960" height="640" fill="#FFFFFF"/>
<text x="30" y="38" font-size="17" fill="#2C2C2A" font-weight="bold" text-anchor="start">CIDR 읽는 법: IP 주소는 4칸(칸마다 8비트, 0~255). <tspan fill="#993C1D">/ 뒤 숫자 = 앞에서부터 고정하는 비트 수</tspan></text>
<text x="304.0" y="68" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="middle">1번째 칸</text>
<text x="424.0" y="68" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="middle">2번째 칸</text>
