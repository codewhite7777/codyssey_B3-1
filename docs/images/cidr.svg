<text x="740" y="324" font-size="14" fill="#3C3489" font-weight="bold" text-anchor="start">1개</text>
<text x="30" y="404" font-size="14" fill="#5F5E5A" font-weight="bold" text-anchor="start">숫자가 클수록 고정이 많아 범위가 좁다:</text>
<text x="330" y="404" font-size="15" fill="#993C1D" font-weight="bold" text-anchor="start">/0</text>
<text x="364" y="404" font-size="13" fill="#5F5E5A" font-weight="normal" text-anchor="start">전체 (HTTP 80)</text>
<text x="476" y="404" font-size="16" fill="#5F5E5A" font-weight="bold" text-anchor="middle">›</text>
<text x="490" y="404" font-size="15" fill="#185FA5" font-weight="bold" text-anchor="start">/16</text>
<text x="524" y="404" font-size="13" fill="#5F5E5A" font-weight="normal" text-anchor="start">65,536개 (VPC)</text>
<text x="636" y="404" font-size="16" fill="#5F5E5A" font-weight="bold" text-anchor="middle">›</text>
<text x="650" y="404" font-size="15" fill="#0F6E56" font-weight="bold" text-anchor="start">/24</text>
<text x="684" y="404" font-size="13" fill="#5F5E5A" font-weight="normal" text-anchor="start">256개 (Subnet)</text>
<text x="796" y="404" font-size="16" fill="#5F5E5A" font-weight="bold" text-anchor="middle">›</text>
<text x="810" y="404" font-size="15" fill="#3C3489" font-weight="bold" text-anchor="start">/32</text>
<text x="844" y="404" font-size="13" fill="#5F5E5A" font-weight="normal" text-anchor="start">1개 (SSH 22)</text>
