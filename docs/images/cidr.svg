<text x="30" y="104" font-size="15" fill="#185FA5" font-weight="bold" text-anchor="start">VPC</text>
<text x="30" y="126" font-size="15" fill="#2C2C2A" font-weight="bold" text-anchor="start">10.0.0.0/16</text>
