<text x="544.0" y="113" font-size="16" fill="#5F5E5A" font-weight="normal" text-anchor="middle">0~255</text>
<rect x="610" y="84" width="108" height="44" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="664.0" y="113" font-size="16" fill="#5F5E5A" font-weight="normal" text-anchor="middle">0~255</text>
