<svg xmlns="http://www.w3.org/2000/svg" width="680" height="842" viewBox="0 0 680 842" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>구축 흐름: 계정 준비부터 리소스 정리까지</title><rect width="680" height="842" fill="#FFFFFF" rx="12"/><rect x="40" y="24" width="440" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="260.0" y="41.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">1. 계정 준비</text><text x="260.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">MFA · 결제 알림 · IAM 정책과 사용자</text><line x1="260.0" y1="78" x2="260.0" y2="92" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 90 L260.0 98 L265.0 90" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="98" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">2. VPC와 Subnet 만들기</text><text x="260.0" y="136.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">10.0.0.0/16 · 10.0.1.0/24 · 퍼블릭 IP 자동 할당</text><line x1="260.0" y1="152" x2="260.0" y2="166" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 164 L260.0 172 L265.0 164" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="172" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260.0" y="189.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">3. Internet Gateway 연결</text><text x="260.0" y="210.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">b3-1-igw → b3-1-vpc에 Attach</text><line x1="260.0" y1="226" x2="260.0" y2="240" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 238 L260.0 246 L265.0 238" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="246" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">4. Route Table 설정</text><text x="260.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">0.0.0.0/0 → IGW · 서브넷 연결</text><line x1="260.0" y1="300" x2="260.0" y2="314" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 312 L260.0 320 L265.0 312" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="320" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="260.0" y="337.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">5. Security Group 만들기</text><text x="260.0" y="358.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">80 ← 0.0.0.0/0 · 22 ← 내 IP/32</text><line x1="260.0" y1="374" x2="260.0" y2="388" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 386 L260.0 394 L265.0 386" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="394" width="440" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="260.0" y="411.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">6. EC2 만들기</text><text x="260.0" y="432.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">t3.micro · Ubuntu · 크레딧 Standard</text><line x1="260.0" y1="448" x2="260.0" y2="462" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 460 L260.0 468 L265.0 460" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="468" width="440" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="260.0" y="485.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">7. SSH 접속, 아웃바운드 확인</text><text x="260.0" y="506.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ssh -i key.pem · curl -I https://example.com</text><line x1="260.0" y1="522" x2="260.0" y2="536" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 534 L260.0 542 L265.0 534" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="542" width="440" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="260.0" y="559.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">8. Nginx와 /health 설정</text><text x="260.0" y="580.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">apt install nginx · location = /health</text><line x1="260.0" y1="596" x2="260.0" y2="610" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 608 L260.0 616 L265.0 608" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="616" width="440" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="260.0" y="633.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">9. 외부 접속 검증 (B)</text><text x="260.0" y="654.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">curl -i http://&lt;퍼블릭IP&gt;/health → 200 OK</text><line x1="260.0" y1="670" x2="260.0" y2="684" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 682 L260.0 690 L265.0 682" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="690" width="440" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="260.0" y="707.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">10. 트러블슈팅 재현</text><text x="260.0" y="728.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">SG 80 제거 → timeout → 근거 확인 → 복구</text><line x1="260.0" y1="744" x2="260.0" y2="758" stroke="#5F5E5A" stroke-width="1.3"/><path d="M255.0 756 L260.0 764 L265.0 756" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><rect x="40" y="764" width="440" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="260.0" y="781.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">11. 리소스 정리</text><text x="260.0" y="802.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">EC2 → 키페어 → SG → Subnet/RT → IGW → VPC</text><path d="M490 24 L500 24 L500 78 L490 78" fill="none" stroke="#888780" stroke-width="1"/><text x="510" y="42.0" dominant-baseline="central" font-size="12" font-weight="600" fill="#5F5E5A">루트 계정 콘솔</text><text x="510" y="60.0" dominant-baseline="central" font-size="12" fill="#5F5E5A">마지막 루트 사용</text><path d="M490 98 L500 98 L500 448 L490 448" fill="none" stroke="#888780" stroke-width="1"/><text x="510" y="264.0" dominant-baseline="central" font-size="12" font-weight="600" fill="#5F5E5A">IAM 사용자 콘솔</text><text x="510" y="282.0" dominant-baseline="central" font-size="12" fill="#5F5E5A">b3-1-user로 로그인</text><path d="M490 468 L500 468 L500 596 L490 596" fill="none" stroke="#888780" stroke-width="1"/><text x="510" y="523.0" dominant-baseline="central" font-size="12" font-weight="600" fill="#5F5E5A">EC2 안 (SSH)</text><text x="510" y="541.0" dominant-baseline="central" font-size="12" fill="#5F5E5A">ubuntu@ 프롬프트</text><path d="M490 616 L500 616 L500 670 L490 670" fill="none" stroke="#888780" stroke-width="1"/><text x="510" y="634.0" dominant-baseline="central" font-size="12" font-weight="600" fill="#5F5E5A">내 PC 터미널</text><text x="510" y="652.0" dominant-baseline="central" font-size="12" fill="#5F5E5A">인터넷 바깥에서 확인</text><path d="M490 690 L500 690 L500 818 L490 818" fill="none" stroke="#888780" stroke-width="1"/><text x="510" y="745.0" dominant-baseline="central" font-size="12" font-weight="600" fill="#5F5E5A">콘솔 + 내 PC</text><text x="510" y="763.0" dominant-baseline="central" font-size="12" fill="#5F5E5A">증빙 후 삭제</text></svg>
