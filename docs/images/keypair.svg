<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif"><defs><marker id="ah2C2C2A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C2C2A"/></marker><marker id="ah185FA5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#185FA5"/></marker><marker id="ah0F6E56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah3C3489" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3C3489"/></marker><marker id="ah993C1D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#993C1D"/></marker><marker id="ah5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="960" height="470" fill="#FFFFFF"/><text x="30" y="36" font-size="18" fill="#2C2C2A" font-weight="bold" text-anchor="start">키 페어 = 열쇠(개인키)와 자물쇠(공개키) 한 쌍</text>
<text x="30" y="60" font-size="14" fill="#5F5E5A" font-weight="normal" text-anchor="start">열쇠는 내 PC에만, 자물쇠는 서버에. 둘이 맞아야 SSH로 들어갈 수 있다</text>
<rect x="30" y="85" width="300" height="230" rx="8" fill="#F3F2EE" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="50" y="112" font-size="15" fill="#2C2C2A" font-weight="bold" text-anchor="start">내 PC (Mac)</text>
<rect x="50" y="128" width="260" height="72" rx="8" fill="#FFFFFF" stroke="#3C3489" stroke-width="2"/>
<text x="66" y="154" font-size="14" fill="#3C3489" font-weight="bold" text-anchor="start">🔑 개인키  b3-1-key.pem</text>
<text x="66" y="178" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="start">열쇠. 나만 가짐. 재발급 불가</text>
<rect x="50" y="214" width="260" height="80" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="66" y="240" font-size="14" fill="#2C2C2A" font-weight="bold" text-anchor="start">📒 ~/.ssh/known_hosts</text>
<text x="66" y="262" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="start">처음 접속 때 yes → 서버 지문 저장</text>
<text x="66" y="280" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="start">(이 서버가 맞는지 다음에 확인)</text>
<rect x="400" y="85" width="530" height="230" rx="8" fill="#EAF2FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="420" y="112" font-size="15" fill="#185FA5" font-weight="bold" text-anchor="start">AWS 서울 리전</text>
<rect x="420" y="128" width="220" height="72" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.5"/>
<text x="436" y="154" font-size="14" fill="#185FA5" font-weight="bold" text-anchor="start">키 페어 목록  b3-1-key</text>
<text x="436" y="178" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="start">공개키 보관 (개인키는 안 가짐)</text>
<rect x="680" y="128" width="230" height="166" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/>
<text x="696" y="154" font-size="14" fill="#0F6E56" font-weight="bold" text-anchor="start">EC2  b3-1-ec2-web</text>
<rect x="696" y="168" width="198" height="60" rx="8" fill="#E6F4EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="708" y="192" font-size="13" fill="#0F6E56" font-weight="bold" text-anchor="start">🔒 공개키 (자물쇠)</text>
<text x="708" y="214" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="start">~/.ssh/authorized_keys</text>
<text x="696" y="254" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="start">만들 때 공개키가</text>
<text x="696" y="272" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="start">서버 안으로 복사됨</text>
<line x1="640" y1="164" x2="692" y2="192" stroke="#185FA5" stroke-width="2" marker-end="url(#ah185FA5)"/>
<text x="645" y="150" font-size="12" fill="#185FA5" font-weight="bold" text-anchor="start">복사</text>
<line x1="312" y1="196" x2="690" y2="218" stroke="#3C3489" stroke-width="2" marker-end="url(#ah3C3489)"/>
<text x="360" y="240" font-size="13" fill="#3C3489" font-weight="bold" text-anchor="start">ssh -i b3-1-key.pem ubuntu@IP</text>
<text x="360" y="260" font-size="12" fill="#5F5E5A" font-weight="normal" text-anchor="start">열쇠로 증명 → 서버가 자물쇠로 확인 → 접속</text>
<text x="30" y="352" font-size="15" fill="#993C1D" font-weight="bold" text-anchor="start">정리할 때 지우는 곳 (서버가 없으니 열쇠·자물쇠·기록 모두 쓸 곳이 없음)</text>
<rect x="30" y="366" width="214" height="78" rx="8" fill="#FBF1EC" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="52" cy="392" r="12" fill="#993C1D"/>
<text x="52" y="397" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="72" y="397" font-size="14" fill="#993C1D" font-weight="bold" text-anchor="start">EC2 종료</text>
<text x="46" y="426" font-size="12" fill="#2C2C2A" font-weight="normal" text-anchor="start">자물쇠가 서버와 함께 사라짐</text>
<rect x="258" y="366" width="214" height="78" rx="8" fill="#FBF1EC" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="280" cy="392" r="12" fill="#993C1D"/>
<text x="280" y="397" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<text x="300" y="397" font-size="14" fill="#993C1D" font-weight="bold" text-anchor="start">AWS 키 페어 삭제</text>
<text x="274" y="426" font-size="12" fill="#2C2C2A" font-weight="normal" text-anchor="start">다른 서버에 재사용 방지</text>
<rect x="486" y="366" width="214" height="78" rx="8" fill="#FBF1EC" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="508" cy="392" r="12" fill="#993C1D"/>
<text x="508" y="397" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<text x="528" y="397" font-size="14" fill="#993C1D" font-weight="bold" text-anchor="start">내 PC .pem 삭제</text>
<text x="502" y="426" font-size="12" fill="#2C2C2A" font-weight="normal" text-anchor="start">쓸 곳 없는 비밀 파일 제거</text>
<rect x="714" y="366" width="214" height="78" rx="8" fill="#FBF1EC" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="736" cy="392" r="12" fill="#993C1D"/>
<text x="736" y="397" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<text x="756" y="397" font-size="14" fill="#993C1D" font-weight="bold" text-anchor="start">known_hosts 정리</text>
<text x="730" y="426" font-size="12" fill="#2C2C2A" font-weight="normal" text-anchor="start">반납된 IP의 옛 지문 제거 (선택)</text></svg>